<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex"><meta name="referrer" content="no-referrer"><title>Recuperar contraseña | Star Water</title><link rel="stylesheet" href="/style.css"><script defer src="/recuperar.js"></script></head>
<body><main class="portal-main"><div class="wrap portal-login">
<p class="eyebrow">STAR WATER · PLATAFORMA PARA ASADAS</p><h1>Restablecer contraseña</h1>
<form id="request" class="water-panel" method="post" hidden><p>Ingrese el correo de su cuenta para recibir un enlace.</p><label>Correo electrónico<input name="email" type="email" autocomplete="email" maxlength="254" required></label><button class="button primary" type="submit">Enviar enlace</button></form>
<form id="save" class="water-panel" method="post" hidden><label>Nueva contraseña<input name="password" type="password" autocomplete="new-password" minlength="8" maxlength="128" required></label><label>Confirme su contraseña<input name="repeat" type="password" autocomplete="new-password" minlength="8" maxlength="128" required></label><button class="button primary" type="submit">Guardar contraseña</button></form>
<p id="status" role="status"></p><p><a href="/acceso.html">Volver al ingreso</a></p><noscript>Active JavaScript para restablecer su contraseña.</noscript></div></main></body></html>
