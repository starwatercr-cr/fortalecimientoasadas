<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Solicitudes de clientes | Star Water</title><link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/consulta-agua.css"><link rel="stylesheet" href="/star-water.css"><link rel="stylesheet" href="/solicitudes-clientes.css"><script defer src="/solicitudes-clientes.js?v=4"></script></head>
<body class="intake-page">
<header class="requests-header"><div class="wrap">
  <a href="/" aria-label="Inicio de Star Water"><img src="/assets/logo.png" alt="Star Water Soluciones Innovadoras" width="452" height="128"></a>
  <a class="requests-back" href="/herramientas.html">← Volver a la plataforma</a>
</div></header>
<main>
<section class="section star-platform requests-hero"><div class="wrap">
<h1>Solicitudes de clientes</h1>
<p>Revise las consultas de Servicios generales y registre la cita confirmada en Google Calendar. Las horas se muestran en Costa Rica.</p>
<div class="actions"><a class="button primary" href="https://calendar.app.google/tzqcKoUnyX2Jcktt6" target="_blank" rel="noopener noreferrer">Ver agenda de reservas</a></div>
</div></section>
<div class="wrap intake requests-main">
<p id="status" role="status"></p>
<div id="requests" class="requests-list"></div>
<button class="button outline" id="more" type="button" hidden>Ver más solicitudes</button>
<template id="request">
<article class="intake-card requests-card">
<h2></h2><p data-case></p><dl></dl>
<a data-file hidden>Descargar respuesta del operador</a>
<form>
<div class="intake-grid">
<label>Estado<select name="status"><option>Nuevo</option><option>En revisión</option><option>Pendiente de información</option><option>Cerrado</option></select></label>
<label>Cita confirmada en Costa Rica<input name="appointment" type="datetime-local"></label>
</div>
<button class="button primary" type="submit">Guardar cambios</button>
<p role="status"></p>
</form>
</article>
</template>
</div></main></body></html>
