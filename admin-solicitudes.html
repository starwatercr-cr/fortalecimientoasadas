<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Administración de solicitudes | STRATEGIA 360°</title><style>body{margin:0;background:#eef8fb;font:15px/1.5 Inter,Arial,sans-serif;color:#14334a}*{box-sizing:border-box}header{background:white;padding:22px 5%;display:flex;justify-content:space-between;gap:12px;align-items:center}main{max-width:1100px;margin:35px auto;padding:0 20px}h1{margin-bottom:8px}p{color:#597282}.panel{background:white;border:1px solid #d4e8ee;border-radius:18px;padding:24px;box-shadow:0 20px 45px #14334a0d}.item{padding:18px 0;border-bottom:1px solid #d4e8ee;display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap}.item:last-child{border-bottom:0}.sub{font-size:13px;color:#597282;overflow-wrap:anywhere}.actions{display:flex;gap:8px}button{border:0;border-radius:9px;background:#087d9c;color:white;padding:11px 16px;font-weight:bold;cursor:pointer}button.reject{background:#e7eef2;color:#14334a}button:disabled{opacity:.5}a{color:#087d9c}#error{color:#b12d2d}small{color:#597282}</style></head><body><header><strong>STRATEGIA <span style="color:#087d9c">360°</span> · Administración</strong><a href="login.html">Volver al ingreso</a></header><main><h1>Solicitudes de demostración</h1><p>Revisá las solicitudes y autorizá el acceso de cada empresa.</p><div class="panel"><p id="status">Comprobando permisos…</p><p id="error" role="alert"></p><div id="lista"></div></div></main><script src="config.js"></script><script src="auth.js"></script><script>const statusEl=document.getElementById('status'),errorEl=document.getElementById('error'),lista=document.getElementById('lista');function el(tag,text,cls){const n=document.createElement(tag);if(text!==undefined)n.textContent=text;if(cls)n.className=cls;return n}async function cargar(){errorEl.textContent='';const user=await S360.currentUser();if(!user||!(await S360.isAdmin())){statusEl.textContent='Acceso restringido. Iniciá sesión con la cuenta administradora.';return}const items=await S360.listRequests();statusEl.textContent=items.length?items.length+' solicitud(es) registradas':'Todavía no hay solicitudes.';lista.replaceChildren();for(const s of items){const row=el('div',undefined,'item'),info=el('div');info.append(el('strong',s.empresa+' — '+s.nombre),el('div',s.email+' · '+s.whatsapp,'sub'),el('small','Estado: '+s.estado+' · '+new Date(s.creado_en).toLocaleString('es-CR')));row.append(info);if(s.estado==='pendiente'){const actions=el('div',undefined,'actions');for(const [label,accion,cls] of [['Aprobar','aprobar',''],['Rechazar','rechazar','reject']]){const b=el('button',label,cls);b.onclick=async()=>{if(!confirm('¿'+label+' esta solicitud?'))return;b.disabled=true;errorEl.textContent='';try{const result=await S360.reviewRequest(s.id,accion);if(result.mensaje)alert(result.mensaje);await cargar()}catch(e){errorEl.textContent=e.message;b.disabled=false}};actions.append(b)}row.append(actions)}lista.append(row)}}cargar().catch(e=>{statusEl.textContent='No fue posible cargar las solicitudes.';errorEl.textContent=e.message});</script></body></html>
