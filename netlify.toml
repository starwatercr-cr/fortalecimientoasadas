[build]
  command = "npm run build"
  publish = "build"
  functions = "netlify/functions"
[functions]
  node_bundler = "esbuild"
  included_files = ["private/**"]
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/gateway?api=:splat"
  status = 200
  force = true
[[redirects]]
